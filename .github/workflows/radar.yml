# Beyblade X 原價開賣雷達 — 雲端排程
#
# 為什麼 workflow 必須在預設分支:GitHub 只會註冊「預設分支上的」schedule
# 觸發器。放在功能分支上的排程永遠不會執行。
#
# Secrets（Repo → Settings → Secrets and variables → Actions）:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (或 DISCORD_WEBHOOK_URL)
#   SHOPEE_AFFILIATE_ID (可選)

name: radar

on:
  schedule:
    - cron: "*/15 * * * *" # 每 15 分鐘（UTC）
  workflow_dispatch: {}

# 同時只跑一個，避免兩輪同時 commit 造成推送衝突
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt

      - name: Install deps
        run: pip install -r radar/requirements.txt

      # radar.db 跟著 repo 走，狀態才能跨執行保存。沒有它就偵測不到「補貨」
      # ——每一輪都會看起來像第一次見到這個商品。
      - name: Run one radar pass
        working-directory: radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
          RADAR_DB_PATH: ${{ github.workspace }}/data/radar.db
        run: python run.py --once

      - name: Export site data
        working-directory: radar
        run: python export_web.py --db "${{ github.workspace }}/data/radar.db" --out "${{ github.workspace }}/data"

      # 只有真的有變動才 commit。Vercel Hobby 每天 100 次部署上限，
      # 每 15 分鐘無條件 commit 會是 96 次／天，加上其他推送就會爆掉。
      - name: Commit data if changed
        run: |
          git config user.name  "beygear-radar[bot]"
          git config user.email "beygear-radar[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change; skipping commit"
            exit 0
          fi
          git commit -m "chore(data): radar snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
